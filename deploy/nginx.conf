# Nginx configuration for the Landlord-Tenant Direct Connect Platform
# (Sprint 7.7, production deployment reference).
#
# This is a REFERENCE configuration for a Linux production host (AGENTS 44).
# Nginx terminates HTTPS and proxies requests to Gunicorn, which runs the
# Django application. Static files are served by WhiteNoise inside Django
# (production.py), so Nginx only proxies dynamic requests and the WhiteNoise
# cache; media/uploads are served from a persistent media location.
#
# Replace example.com and the TLS certificate paths with the real hostnames
# and certificate locations.

server {
    listen 80;
    server_name example.com;

    # Redirect all HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    # --- TLS certificate ---
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Security headers (defense in depth; Django also sets these) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # --- Django receives the original scheme so HTTPS/secure cookies work ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Request size limits for apartment image uploads ---
    client_max_body_size 20m;

    # --- Django/Gunicorn application ---
    location / {
        proxy_pass http://unix:/run/gunicorn/landlord_tenant.sock;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # --- Media (uploaded apartment images) ---
    # Must point at the deployment media directory used by MEDIA_ROOT.
    location /media/ {
        alias /var/www/landlord_tenant/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Static (WhiteNoise) ---
    # Optional: if you prefer Nginx to serve the collected static files
    # directly, uncomment aliases to STATIC_ROOT instead of relying on
    # WhiteNoise's middleware. WhiteNoise remains enabled in production.py.
    # location /static/ {
    #     alias /var/www/landlord_tenant/staticfiles/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}
