{% extends "base.html" %}
{% block title %}Something went wrong | LT Direct{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
         style="width:80px;height:80px;border-radius:20px;background:#fef3c7;color:#b45309;font-size:2rem;">
        <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
    </div>
    <h1 class="display-4 fw-bold">500</h1>
    <p class="lead mb-2">Something went wrong on our side.</p>
    <p class="text-muted mb-4">Please try again in a moment. If the problem continues, contact support.</p>
    <a href="{% url 'home' %}" class="btn btn-primary px-4">
        <i class="bi bi-house me-1"></i>Return home
    </a>
</div>
{% endblock %}
