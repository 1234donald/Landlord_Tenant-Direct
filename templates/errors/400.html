{% extends "base.html" %}
{% block title %}Bad request | LT Direct{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
         style="width:80px;height:80px;border-radius:20px;background:var(--lt-primary-light);color:var(--lt-primary);font-size:2rem;">
        <i class="bi bi-slash-circle" aria-hidden="true"></i>
    </div>
    <h1 class="display-4 fw-bold">400</h1>
    <p class="lead mb-2">Your request could not be processed.</p>
    <p class="text-muted mb-4">Please check the details you entered and try again.</p>
    <a href="{% url 'home' %}" class="btn btn-primary px-4">
        <i class="bi bi-house me-1"></i>Return home
    </a>
</div>
{% endblock %}
