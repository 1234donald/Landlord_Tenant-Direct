{% extends "base.html" %}

{% block title %}New conversation - Landlord-Tenant Direct Connect{% endblock %}

{% block content %}
<h1 class="h3 mb-4"><i class="bi bi-person-plus me-2"></i>Contact a landlord</h1>

<form method="post" class="card shadow-sm">
    {% csrf_token %}
    <div class="card-body">
        <div class="mb-3">
            {% if preselected_id %}
            <input type="hidden" name="landlord" value="{{ preselected_id }}">
            <p class="text-muted small mb-0">
                You are starting a conversation with this landlord.
            </p>
            {% else %}
            <label class="form-label" for="landlord">Choose a landlord to contact</label>
            <select name="landlord" id="landlord" class="form-select" required>
                <option value="">-- Select a landlord --</option>
                {% for entry in landlord_entries %}
                <option value="{{ entry.id }}">{{ entry.full_name }} ({{ entry.location }})</option>
                {% endfor %}
            </select>
            {% endif %}
        </div>
        <button type="submit" class="btn btn-primary">Start conversation</button>
    </div>
</form>
{% endblock %}
